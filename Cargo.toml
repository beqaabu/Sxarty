[package]
name = "sxarty"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A focused RSVP speed reader for the desktop"
license = "MIT"
repository = "https://github.com/beqaabu/Sxarty"
readme = "README.md"
keywords = ["speed-reading", "rsvp", "reader", "iced"]
categories = ["gui", "text-processing"]

build = "build.rs"

[[bin]]
name = "sxarty"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "advanced-shaping", "advanced"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# `rt` only: the blocking pool used to parse documents off the UI thread.
tokio = { version = "1", default-features = false, features = ["rt"] }

# Optional document formats. Disable to cut build time to `txt`/`md` only.
pdf-extract = { version = "0.12", optional = true }
epub = { version = "2.1", optional = true }
zip = { version = "8", optional = true, default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["pdf", "docx", "epub"]
pdf = ["dep:pdf-extract"]
docx = ["dep:zip", "dep:quick-xml"]
epub = ["dep:epub", "dep:quick-xml"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
